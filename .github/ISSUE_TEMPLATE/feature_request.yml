name: Feature Request
description: Suggest an idea or enhancement for scm-cleaner
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome proposals for new features, provider adapters, and policy engines!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement or Use Case
      description: Is your feature request related to a specific operational challenge or pain point?
      placeholder: "A clear description of the problem you are facing..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / CLI Interface
      description: Describe what you would like to happen and how the command or policy configuration could look.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you've considered.
  - type: dropdown
    id: area
    attributes:
      label: Affected Component
      options:
        - Policies (Project / User / Runner rules)
        - Provider Adapters (GitLab, GitHub, etc.)
        - CLI / UX / Output formatting
        - Plan & Execution Engine
        - Safety Guards / Audit Logging
        - Documentation / Examples
    validations:
      required: true
