[package]
name = "scm-cleaner"
version = "0.7.0"
edition = "2021"
authors = ["Dominik Hahn"]
description = "A safe, provider-independent CLI for discovering and cleaning up stale SCM projects, users, runner tags, and CI configurations."
license = "MIT"
repository = "https://github.com/domehahn/housekeeping"
readme = "README.md"

[[bin]]
name = "scm-cleaner"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env", "cargo"] }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
tabled = "0.17"
colored = "3.0"
keyring = "3.6"

[dev-dependencies]
tempfile = "3.17"
