# Example: just the policy-relevant portion of a configuration file,
# useful as a copy-paste reference when you already have provider/scope
# settings elsewhere. Merge this into a full config.yaml (see
# examples/config.yaml for a complete, runnable example).

projects:
  inactive:
    enabled: true
    days: 90

  archived:
    enabled: false

  include:
    - "^sandbox-.*"
    - "^test-.*"

  exclude:
    - "^production$"
    - "^infrastructure$"

  protection:
    paths:
      - company/platform/production
      - company/platform/infrastructure
    regex:
      - ".*/production$"
      - ".*/terraform-state$"

users:
  inactive:
    enabled: true
    last_login_days: 30
    last_activity_days: 30
    match: all
    # See examples/config.yaml for the billable-seat override option
    # (ignore_global_activity_if_non_billable_elsewhere) - disabled here
    # by default.

  unknown_activity: skip
  exclude_current_user: true

  protection:
    usernames:
      - root
    regex:
      - "^svc-"
      - "^bot-"
    access_levels:
      - owner
