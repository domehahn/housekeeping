# Example CI pipeline. scm-cleaner is provider-independent, but this
# project's own source happens to be developed on GitLab.

stages:
  - check
  - test
  - build

variables:
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOFLAGS: "-mod=mod"
  # Jobs that opt into `.runner-tagged` can override this in project/group
  # CI/CD variables without editing the pipeline file.
  SCM_CLEANER_RUNNER_TAG: "docker"

default:
  image: golang:1.24
  cache:
    key: go-mod-cache
    paths:
      - .go/pkg/mod/

# Optional runner selection for installations that require tagged runners.
# Add `extends: .runner-tagged` to a job (or copy the tags block to `default`)
# and set SCM_CLEANER_RUNNER_TAG in the project's CI/CD variables. This
# project's own pipeline manages its runner tag this way rather than
# mutating its own runner registration; scm-cleaner itself CAN manage job
# and runner tags for other projects/groups as a deliberate, guarded
# feature (see README §24/§25) - it just isn't used on itself here.
.runner-tagged:
  tags:
    - "$SCM_CLEANER_RUNNER_TAG"

format-check:
  stage: check
  script:
    - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

vet:
  stage: check
  script:
    - go vet ./...

lint:
  stage: check
  image: golangci/golangci-lint:latest
  script:
    - golangci-lint run

test:
  stage: test
  script:
    - go test ./...

race-test:
  stage: test
  script:
    - go test -race ./...

build:
  stage: build
  script:
    - make build
  artifacts:
    paths:
      - bin/
    expire_in: 1 week

# Optional: dependency vulnerability scanning.
security-scan:
  stage: check
  allow_failure: true
  script:
    - go run golang.org/x/vuln/cmd/govulncheck@latest ./...
